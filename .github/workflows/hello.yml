name: Hello World!

on:
  workflow_dispatch:

  push:
    branches:
      - main



jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: |
          echo "Hello World!"

      - name: Print date
        run: |
          date
      
      - name: List directory contents
        run: |
          ls -la